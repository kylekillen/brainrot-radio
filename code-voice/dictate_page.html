<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dictate</title>
<link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;Dictate&quot;,&quot;display&quot;:&quot;standalone&quot;}">
<style>
 body{font:17px/1.45 -apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#111;color:#eee;max-width:720px;margin:auto}
 h1{font-size:20px;margin:4px 0 12px}
 #rec{width:100%;height:120px;border:0;border-radius:18px;font-size:24px;font-weight:600;background:#2a7;color:#fff}
 #rec.on{background:#c33}
 #status{margin:10px 0;color:#aaa;min-height:1.4em}
 textarea{width:100%;box-sizing:border-box;min-height:180px;font:inherit;background:#1c1c1c;color:#eee;border:1px solid #333;border-radius:10px;padding:10px}
 .row{display:flex;gap:8px;margin:8px 0}
 .row button{flex:1;padding:14px;font-size:17px;border-radius:10px;border:0;background:#333;color:#eee}
 .h{border-top:1px solid #333;padding:10px 0}
 .h small{color:#888}
 .h button{float:right;padding:6px 12px;border:0;border-radius:8px;background:#333;color:#eee}
</style></head><body>
<h1>🎙 Dictate</h1>
<button id="rec">Tap to record</button>
<div id="status">Runs on the Mac mini · no word limit</div>
<textarea id="out" placeholder="Your words appear here."></textarea>
<div class="row"><button id="copy">Copy</button><button id="rawbtn">Show raw</button></div>
<h1 style="margin-top:22px">History</h1>
<div id="hist"></div>
<script>
const $=id=>document.getElementById(id);
let mr=null,chunks=[],t0=0,timer=null,wake=null,last=null,showingRaw=false;
async function start(){
  const st=await navigator.mediaDevices.getUserMedia({audio:true});
  chunks=[];mr=new MediaRecorder(st);
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());send()};
  mr.start(1000);t0=Date.now();
  $('rec').classList.add('on');$('rec').textContent='Tap to stop';
  timer=setInterval(()=>{const s=Math.round((Date.now()-t0)/1000);$('status').textContent='Recording… '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},500);
  try{wake=await navigator.wakeLock.request('screen')}catch(e){}
}
function stop(){clearInterval(timer);mr.stop();mr=null;$('rec').classList.remove('on');$('rec').textContent='Tap to record';if(wake){wake.release();wake=null}}
async function send(){
  const blob=new Blob(chunks,{type:chunks[0]?.type||'audio/webm'});
  if(blob.size<1024){$('status').textContent='Nothing recorded — tap and hold a moment longer.';return}
  const ext=(blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm');
  $('status').textContent='Transcribing '+Math.round(blob.size/1024)+' KB…';
  const fd=new FormData();fd.append('file',blob,'dictation.'+ext);fd.append('model','parakeet');fd.append('source','page');
  try{
    const r=await fetch('v1/audio/transcriptions?source=page',{method:'POST',body:fd});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||r.status);
    last=d;showingRaw=false;$('out').value=d.text;$('rawbtn').textContent='Show raw';
    $('status').textContent=d.cleanup==='clean'?'Done · cleaned up':'Done · '+d.cleanup;
    try{await navigator.clipboard.writeText(d.text);$('status').textContent+=' · copied'}catch(e){}
    loadHist();
  }catch(e){$('status').textContent='Failed: '+e.message+' — your audio was kept on the mini.'}
}
$('rec').onclick=()=>mr?stop():start().catch(e=>$('status').textContent='Mic blocked: '+e.message);
$('copy').onclick=async()=>{await navigator.clipboard.writeText($('out').value);$('status').textContent='Copied'};
$('rawbtn').onclick=()=>{if(!last)return;showingRaw=!showingRaw;$('out').value=showingRaw?last.raw:last.text;$('rawbtn').textContent=showingRaw?'Show clean':'Show raw'};
async function loadHist(){
  const h=await (await fetch('history')).json();
  $('hist').innerHTML='';
  h.forEach(e=>{const d=document.createElement('div');d.className='h';
    const b=document.createElement('button');b.textContent='Copy';b.onclick=()=>navigator.clipboard.writeText(e.text);
    const s=document.createElement('small');s.textContent=new Date(e.ts).toLocaleString()+' · '+e.source;
    const p=document.createElement('div');p.textContent=e.text;
    d.append(b,s,p);$('hist').append(d)});
}
loadHist();
</script></body></html>
